<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Don Mariano Marcos Memorial State University</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <img src="images/logo.png" alt="DMMMSU Logo" />
      <h1>Don Mariano Marcos Memorial State University</h1>
    </header>
    <nav class="navbar">
      <a href="home.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </nav>

    <div class="container">
      <main>
        <form action="/login" method="POST" class="form">
          <table>
            <th colspan="2"><h3>Login Form</h3></th>
            <tr>
              <td><label for="username">Username:</label></td>
              <td><input type="text" id="username" required /></td>
            </tr>
            <tr>
              <td><label for="password">Password:</label></td>
              <td><input type="password" id="password" required /></td>
            </tr>
            <tr>
              <td colspan="2">
                <div class="buttons">
                  <button button-type="submit">Login</button>
                  <button button-type="submit">Register</button>
                </div>
              </td>
            </tr>
          </table>
        </form>
      </main>
      <side class="side">
        <img src="images/image1.jpg" alt="an image" />
      </side>
    </div>
    <footer class="footer">
      <p>All Rights Reserved 2027</p>
    </footer>
  </body>
</html>
